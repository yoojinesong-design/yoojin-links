<title>The Drifter's Guide to Gravity</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: a field guide. Cover band on a map grid, a route of six checkpoints (rail on desktop, strip on phone), one working sheet at a time, each ending in a readout. */
:root{
  --bg:#E9E8E2;--surface:#F7F6F2;--sunk:#DEDCD4;
  --ink:#171B1F;--ink2:#4B5158;--ink3:#767B82;
  --rule:#CBC9C0;--grid:rgba(23,27,31,.07);
  --accent:#2F5B70;--accent-ink:#FFFFFF;--accent-bg:#DAE7EC;
  --contour:#96653A;
  --good:#2A7648;--warn:#8A6218;--crit:#9A3A34;
  --sans:'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Consolas,monospace;
  --serif:'Gowun Batang','Noto Serif KR',Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101315;--surface:#181C20;--sunk:#0B0D0F;
  --ink:#DAD8D2;--ink2:#A0A29E;--ink3:#73767A;
  --rule:#2B3035;--grid:rgba(218,216,210,.06);
  --accent:#72B2CE;--accent-ink:#0B1418;--accent-bg:#152630;
  --contour:#C4935F;
  --good:#5CC27E;--warn:#D2A644;--crit:#DC6A62;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101315;--surface:#181C20;--sunk:#0B0D0F;
  --ink:#DAD8D2;--ink2:#A0A29E;--ink3:#73767A;
  --rule:#2B3035;--grid:rgba(218,216,210,.06);
  --accent:#72B2CE;--accent-ink:#0B1418;--accent-bg:#152630;
  --contour:#C4935F;
  --good:#5CC27E;--warn:#D2A644;--crit:#DC6A62;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* cover */
.cover{border-bottom:1px solid var(--rule);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
.cover .wrap{padding-block:28px 22px;display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between}
.cover-id{min-width:0;flex:1 1 320px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.cover h1{font-family:var(--serif);font-weight:700;font-size:clamp(24px,4.6vw,38px);line-height:1.15;letter-spacing:-.01em;text-wrap:balance;margin-top:8px}
.cover .ko{color:var(--ink2);margin-top:6px}
.motto{font-family:var(--mono);font-weight:600;font-size:clamp(15px,2.6vw,20px);letter-spacing:.06em;color:var(--contour);border:2px solid var(--contour);padding:8px 14px;border-radius:2px;white-space:nowrap;transform:rotate(-2deg)}

/* mode bar */
.modebar{border-bottom:1px solid var(--rule);background:var(--surface)}
.modebar .wrap{padding-block:10px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.modebar p{font-size:13px;color:var(--ink2);min-width:0;flex:1 1 260px}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--contour);color:var(--contour);border-radius:2px;margin-right:8px}
.modebar .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.status{font-family:var(--mono);font-size:11px;color:var(--ink3)}

/* buttons */
.btn{border:1px solid var(--rule);background:var(--surface);padding:7px 13px;border-radius:3px;cursor:pointer;font-size:13.5px;font-weight:500}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-style:dashed;color:var(--ink2)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.x{border:none;background:none;color:var(--ink3);cursor:pointer;padding:4px 8px;font-size:16px;line-height:1;border-radius:3px}
.x:hover{color:var(--crit)}

/* shell */
.shell{display:grid;grid-template-columns:1fr;gap:20px;padding-block:20px 56px}
@media (min-width:860px){.shell{grid-template-columns:212px minmax(0,1fr);gap:40px;padding-block:32px 72px}}

/* route */
.route{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.cp{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--surface);border-radius:3px;padding:6px 10px;cursor:pointer;text-align:left}
.cp .n{font-family:var(--mono);font-size:11px;width:20px;height:20px;border:1.5px solid var(--ink3);border-radius:50%;display:grid;place-items:center;color:var(--ink3);flex:none}
.cp .t{font-size:13.5px;font-weight:600;white-space:nowrap}
.cp .d{display:none}
.cp.done .n{border-color:var(--good);background:var(--good);color:var(--surface)}
.cp[aria-current="true"]{border-color:var(--accent);background:var(--accent-bg)}
.cp[aria-current="true"] .n{border-color:var(--accent);color:var(--accent)}
.cp.done[aria-current="true"] .n{color:var(--surface);border-color:var(--good)}
@media (min-width:860px){
  .route{flex-direction:column;gap:0;overflow:visible;position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);align-self:start;padding:0}
  .cp{border:none;background:none;padding:9px 8px;align-items:flex-start;position:relative;border-radius:3px}
  .cp:not(:last-child)::after{content:"";position:absolute;left:17.5px;top:32px;bottom:-8px;border-left:1.5px dashed var(--contour);opacity:.6}
  .cp .n{margin-top:2px;background:var(--bg);position:relative;z-index:1}
  .cp .d{display:block;font-size:12px;color:var(--ink3);line-height:1.4;font-weight:400}
  .cp[aria-current="true"]{background:var(--accent-bg)}
  .cp[aria-current="true"] .n{background:var(--accent-bg)}
  .cp.done .n{background:var(--good)}
}

/* sheet */
.sheet{min-width:0;display:flex;flex-direction:column;gap:26px}
.sheet-head h2{font-family:var(--serif);font-size:clamp(26px,5vw,34px);font-weight:700;line-height:1.2;margin-top:4px}
.sheet-head .rule{font-size:16px;color:var(--ink);margin-top:8px;max-width:38em;text-wrap:pretty}
.sheet-head .why{font-size:13.5px;color:var(--ink2);margin-top:6px;max-width:44em}
.q{display:flex;flex-direction:column;gap:10px}
.q>h3{font-size:14.5px;font-weight:600}
.q>h3 .k{font-family:var(--mono);font-size:11px;color:var(--contour);letter-spacing:.08em;margin-right:8px}
.q>.hint{font-size:13px;color:var(--ink3);margin-top:-6px;max-width:46em}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:8px 10px}
.row>.grow{flex:1 1 180px;min-width:0}
input[type=text],input[type=number],input[type=date],textarea{width:100%;background:var(--bg);border:1px solid var(--rule);border-radius:3px;padding:7px 9px;min-width:0}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
textarea{resize:vertical;min-height:64px;line-height:1.55}
input::placeholder,textarea::placeholder{color:var(--ink3)}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field>span{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.w-s{flex:0 0 84px}.w-m{flex:0 0 120px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:2px 10px;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:5px 11px;cursor:pointer;font-size:12.5px;border-left:1px solid var(--rule)}
.seg button:first-child{border-left:none}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* readout */
.readout{border:1.5px solid var(--ink);background:var(--surface);border-radius:2px;padding:18px 18px 20px;display:flex;flex-direction:column;gap:14px}
.readout>.eyebrow{color:var(--contour)}
.big{font-family:var(--serif);font-size:clamp(20px,3.6vw,26px);line-height:1.35;font-weight:700;text-wrap:balance}
.big .num{font-family:var(--mono);font-weight:600;color:var(--accent)}
.note{font-size:13px;color:var(--ink2);max-width:46em}
.note.warn{color:var(--warn)}.note.crit{color:var(--crit)}.note.good{color:var(--good)}
.tally{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:13.5px}
.bar{height:10px;background:var(--sunk);border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:0 2px 2px 0}
.bar>i.mute{background:var(--ink3)}
.bar>i.over{background:var(--crit)}
.stack{display:flex;gap:2px;height:22px}
.stack>i{display:block;background:var(--ink3);opacity:.55;min-width:2px;border-radius:1px}
.stack>i.free{background:var(--accent);opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--ink2)}
.legend b{font-family:var(--mono);font-weight:500;color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:500;padding:6px 8px;border-bottom:1.5px solid var(--rule)}
td{padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
.cols{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:720px){.cols.c3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.col>h3{font-size:14px;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:baseline;border-bottom:1.5px solid var(--ink);padding-bottom:5px}
.col>h3 small{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--ink3)}
.col>.cap{font-size:12.5px;color:var(--ink3)}
.track{background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:10px;display:flex;flex-direction:column;gap:8px}
.track .top{display:flex;gap:6px;align-items:center}
.track .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.empty{border:1px dashed var(--rule);border-radius:3px;padding:14px;font-size:13px;color:var(--ink3);text-align:center}
.creed{font-family:var(--serif);font-size:clamp(18px,3.2vw,23px);line-height:1.7}
.creed span{display:block}
.creed .ph{color:var(--ink3)}
.check{width:20px;height:20px;accent-color:var(--good);cursor:pointer}
.navrow{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--rule);padding-top:16px}
.card-grid{display:grid;grid-template-columns:1fr;gap:0}
.card-grid>div{padding:12px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:1fr;gap:2px}
@media (min-width:620px){.card-grid>div{grid-template-columns:110px minmax(0,1fr);gap:16px}}
.card-grid>div:last-child{border-bottom:none}
.card-grid dt{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--contour);padding-top:3px}
.card-grid dd{margin:0;min-width:0;overflow-wrap:anywhere}
.fine{font-size:12px;color:var(--ink3);max-width:60em}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .25s ease}}
</style>

<header class="cover">
  <div class="wrap">
    <div class="cover-id">
      <div class="eyebrow">Field guide &middot; 6 checkpoints</div>
      <h1>The Drifter's Guide to Gravity</h1>
      <p class="ko">떠도는 이를 위한 중력 안내서. 하는 일은 많은데 무엇이 나를 끌어당기는지 모를 때, 여섯 지점을 차례로 지난다.</p>
    </div>
    <div class="motto" aria-label="Don't panic. Sequence.">DON'T PANIC. SEQUENCE.</div>
  </div>
</header>
<div class="modebar"><div class="wrap" id="modebar"></div></div>
<div class="wrap shell">
  <nav class="route" id="route" aria-label="체크포인트"></nav>
  <main class="sheet" id="sheet"></main>
</div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
function h(tag,attrs){
  var el=document.createElement(tag),i,k,c;
  if(attrs)for(k in attrs){
    var v=attrs[k];
    if(v==null||v===false)continue;
    if(k==='class')el.className=v;
    else if(k==='text')el.textContent=v;
    else if(k.slice(0,2)==='on')el.addEventListener(k.slice(2),v);
    else if(k==='value')el.value=v;
    else if(k==='checked')el.checked=!!v;
    else if(k==='style')el.style.cssText=v;
    else el.setAttribute(k,v===true?'':v);
  }
  for(i=2;i<arguments.length;i++){
    c=arguments[i];
    if(c==null||c===false)continue;
    if(Array.isArray(c))c.forEach(function(x){if(x!=null&&x!==false)el.appendChild(typeof x==='string'?document.createTextNode(x):x)});
    else el.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return el;
}
function uid(){return Math.random().toString(36).slice(2,9)}
function num(v){var n=parseFloat(v);return isFinite(n)?n:0}
function clone(o){return JSON.parse(JSON.stringify(o))}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}

/* ---------- model ---------- */
var VERBS=['돌보다','만들다','지키다','가르치다','고치다','이해하다','연결하다','표현하다','정리하다','이끌다','탐구하다','팔다'];
var RES=[['money','돈'],['time','시간'],['energy','에너지'],['focus','집중']];
var HOURS=[['sleep','수면'],['work','일'],['care','돌봄·가사'],['commute','이동'],['basics','식사·씻기']];
var TIERS=[['gravity','중력선'],['orbit','궤도'],['standby','대기']];

function blank(){return{
  v:1,currency:'$',
  line:{items:[],sentence:''},
  limit:{levels:{money:3,time:3,energy:3,focus:3},hours:{sleep:49,work:40,care:14,commute:5,basics:14},pick:''},
  assets:{rate:3,streams:[],financial:0,unused:[]},
  order:{tracks:[]},
  creed:{forWhom:'',can:'',gap:'',lineage:'',lines:['','','']},
  proof:{name:'',events:[],log:[],action:{text:'',due:'',done:false}}
}}
function example(){return{
  v:1,currency:'$',
  line:{items:[
    {id:'a1',what:'심리학 전공',verbs:['이해하다','돌보다']},
    {id:'a2',what:'육군 실무 간호 (68C)',verbs:['돌보다','지키다']},
    {id:'a3',what:'보훈병원 간호사 (LVN)',verbs:['돌보다']},
    {id:'a4',what:'코드와 작은 서비스 만들기',verbs:['만들다']},
    {id:'a5',what:'AI 음악 카탈로그',verbs:['만들다','표현하다']},
    {id:'a6',what:'배우자 사업 돕기',verbs:['돌보다','만들다']},
    {id:'a7',what:'딸 키우기',verbs:['돌보다','지키다']}
  ],sentence:'나는 만드는 사람이자 돌보는 사람이다.'},
  limit:{levels:{money:4,time:1,energy:2,focus:2},hours:{sleep:49,work:40,care:35,commute:7,basics:14},pick:'time'},
  assets:{rate:3,streams:[
    {id:'s1',name:'재향군인 장애 보상 (VA Disability)',amount:49898,years:42,sure:true},
    {id:'s2',name:'전투 관련 특별 보상 (CRSC)',amount:11400,years:42,sure:true},
    {id:'s3',name:'가족 간병인 지원금 (PCAFC)',amount:26500,years:20,sure:true}
  ],financial:6000,unused:[
    {id:'u1',name:'학비 지원 프로그램 (VANEEP)',using:false},
    {id:'u2',name:'무계약금 주택 대출 (VA Loan)',using:false},
    {id:'u3',name:'상이군인 소유 사업체 인증 (SDVOSB)',using:false},
    {id:'u4',name:'가족 간병인 프로그램 신청',using:true}
  ]},
  order:{tracks:[
    {id:'t1',name:'LVN → BSN → PMHNP',tier:'gravity',hours:12,chain:true,window:true,relight:''},
    {id:'t2',name:'재향군인 혜택 교육 콘텐츠',tier:'orbit',hours:4,chain:true,window:false,relight:''},
    {id:'t3',name:'AI 음악 카탈로그',tier:'orbit',hours:3,chain:false,window:false,relight:''},
    {id:'t4',name:'예약 앱 · 메뉴 앱',tier:'standby',hours:0,chain:false,window:false,relight:'BSN 입학이 확정되면'},
    {id:'t5',name:'카페',tier:'standby',hours:0,chain:false,window:false,relight:'PMHNP 취득 후'},
    {id:'t6',name:'범용 AI 사업 탐색',tier:'standby',hours:0,chain:false,window:false,relight:'중력선이 끝나면 다시 본다'}
  ]},
  creed:{
    forWhom:'나라와 가족. 특히 딸.',
    can:'지켜야 하는 순간이 오면 "할 수 있다"고 말하는 것.',
    gap:'늘 최고조일 필요는 없다. 지금의 나와 필요한 나 사이의 간격을 작게 유지하고, 벌어지면 스스로 닫는다.',
    lineage:'Georges Hébert, "Être fort pour être utile." 그리고 MovNat, Mark Twight, Peter Attia.',
    lines:['Be strong to be useful.','Prove I can return.','Then stay where I returned.']
  },
  proof:{name:'딸의 이름을 붙인 테스트',events:[
    {id:'e1',name:'전력 질주',standard:'400m',meaning:'그녀에게 달려간다'},
    {id:'e2',name:'파머 캐리',standard:'딸 체중 이상, 100m',meaning:'안고 나온다'},
    {id:'e3',name:'바닥에서 일어서기',standard:'손을 쓰지 않고',meaning:'혼자 일어선다'},
    {id:'e4',name:'럭',standard:'2마일',meaning:'부상자 운반과 같은 감각'}
  ],log:[
    {id:'l1',date:'2026-10-04',res:{e1:true,e3:true}},
    {id:'l2',date:'2026-11-01',res:{e1:true,e2:true,e3:true}}
  ],action:{text:'학비 지원 프로그램 신청 상태 확인 전화',due:'',done:false}}
}}

var LS='drifters-guide:v1';
var store={mode:'example',own:null,updatedAt:0};
try{var raw=localStorage.getItem(LS);if(raw){var p=JSON.parse(raw);if(p&&typeof p==='object'){store.mode=p.mode==='own'&&p.own?'own':'example';store.own=p.own||null;store.updatedAt=p.updatedAt||0}}}catch(e){}
var ex=example();
function S(){return store.mode==='own'&&store.own?store.own:ex}

/* ---------- persistence ---------- */
var sync=null,syncTimer=null,syncing=false,syncDirty=false,statusText='';
function setStatus(t){statusText=t;var el=document.getElementById('status');if(el)el.textContent=t}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(store));return true}catch(e){return false}}
function save(){
  if(store.mode!=='own')return;
  store.updatedAt=Date.now();
  var ok=saveLocal();
  if(sync){syncDirty=true;clearTimeout(syncTimer);syncTimer=setTimeout(push,1500)}
  else setStatus(ok?'이 기기에 저장됨':'저장할 수 없는 환경입니다');
}
function push(){
  if(!sync||syncing||!syncDirty)return;
  syncing=true;syncDirty=false;setStatus('저장 중…');
  sync.set({own:clone(store.own),mode:store.mode,updatedAt:store.updatedAt}).then(function(){
    syncing=false;setStatus('계정에 저장됨');if(syncDirty)push();
  },function(){
    syncing=false;sync=null;setStatus('이 기기에 저장됨');
  });
}
function initSync(){
  if(!window.claude||typeof window.claude.use!=='function')return;
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    var db=r[0],user=r[1];if(!db||!user)return;
    return user.id().then(function(id){
      if(!id)return;
      var ref=db.doc('data/users/'+id+'/guide');
      return ref.get().then(function(snap){
        sync=ref;
        var d=snap.exists?snap.data():null;
        if(d&&d.own&&(d.updatedAt||0)>store.updatedAt){
          store.own=clone(d.own);store.mode=d.mode==='example'?'example':'own';store.updatedAt=d.updatedAt;saveLocal();renderAll();
          setStatus('계정에 저장됨');
        }else if(store.own&&store.updatedAt>((d&&d.updatedAt)||0)){syncDirty=true;push()}
        else if(store.mode==='own')setStatus('계정에 저장됨');
      });
    });
  }).catch(function(){sync=null});
}

/* ---------- money ---------- */
function money(v){
  var c=S().currency,a=Math.abs(v),s=v<0?'-':'';
  if(c==='₩'){
    if(a>=1e8)return s+(a/1e8).toFixed(a>=1e9?1:2)+'억 원';
    if(a>=1e4)return s+Math.round(a/1e4).toLocaleString('en-US')+'만 원';
    return s+Math.round(a).toLocaleString('en-US')+'원';
  }
  if(a>=1e6)return s+'$'+(a/1e6).toFixed(2)+'M';
  return s+'$'+Math.round(a).toLocaleString('en-US');
}
function pv(amount,years,rate){
  var r=rate/100;if(years<=0||amount<=0)return 0;
  if(r<=0)return amount*years;
  return amount*(1-Math.pow(1+r,-years))/r;
}

/* ---------- derived ---------- */
function verbTally(){
  var m={};S().line.items.forEach(function(it){(it.verbs||[]).forEach(function(v){m[v]=(m[v]||0)+1})});
  return Object.keys(m).map(function(k){return[k,m[k]]}).sort(function(a,b){return b[1]-a[1]||VERBS.indexOf(a[0])-VERBS.indexOf(b[0])});
}
function freeHours(){var hr=S().limit.hours,t=0;HOURS.forEach(function(x){t+=num(hr[x[0]])});return 168-t}
function lowest(){var lv=S().limit.levels,min=6,keys=[];RES.forEach(function(r){var v=lv[r[0]];if(v<min){min=v;keys=[r[0]]}else if(v===min)keys.push(r[0])});return keys}
function resName(k){for(var i=0;i<RES.length;i++)if(RES[i][0]===k)return RES[i][1];return''}
function assetSum(){
  var a=S().assets,sure=0,vari=0;
  a.streams.forEach(function(s){var x=pv(num(s.amount),num(s.years),num(a.rate));if(s.sure)sure+=x;else vari+=x});
  return{sure:sure,vari:vari,fin:num(a.financial)};
}
function allocated(){var t=0;S().order.tracks.forEach(function(x){if(x.tier!=='standby')t+=num(x.hours)});return t}
function tierCount(k){return S().order.tracks.filter(function(x){return x.tier===k}).length}
function fullPass(a){var ev=S().proof.events;return ev.length>0&&ev.every(function(e){return a.res&&a.res[e.id]})}
function sortedLog(){return S().proof.log.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0})}
function stayCount(){var l=sortedLog(),n=0;for(var i=l.length-1;i>=0;i--){if(fullPass(l[i]))n++;else break}return n}
function done(step){
  var s=S();
  switch(step){
    case'line':return s.line.items.filter(function(i){return i.what&&i.verbs&&i.verbs.length}).length>=3&&!!s.line.sentence.trim();
    case'limit':return!!s.limit.pick;
    case'assets':return s.assets.streams.some(function(x){return num(x.amount)>0&&num(x.years)>0})||num(s.assets.financial)>0;
    case'order':return tierCount('gravity')===1&&tierCount('orbit')<=2;
    case'creed':return s.creed.lines.every(function(l){return l.trim()});
    case'proof':return s.proof.events.filter(function(e){return e.name&&e.standard}).length>=3&&!!s.proof.action.text.trim();
  }
  return false;
}

    var txt=cardText();ta.value=txt;
    var fail=function(){ta.hidden=false;ta.focus();ta.select();copied.textContent='아래 텍스트를 직접 복사하세요'};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){copied.textContent='복사됨'},fail);else fail();
  }}),copied));
  out.push(ta);
  readoutFn=null;
  return out;
}

var VIEWS={line:viewLine,limit:viewLimit,assets:viewAssets,order:viewOrder,creed:viewCreed,proof:viewProof,card:viewCard};

/* ---------- chrome ---------- */
function renderRoute(){
  var nav=document.getElementById('route'),kids=[];
  STEPS.forEach(function(st,i){
    var isCard=st.id==='card';
    kids.push(h('button',{type:'button',class:'cp'+(!isCard&&done(st.id)?' done':''),'aria-current':cur===st.id?'true':'false',onclick:function(){go(st.id)}},
      h('span',{class:'n',text:isCard?'◎':String(i+1)}),h('span',null,h('span',{class:'t',text:st.t}),h('span',{class:'d',text:st.d}))));
  });
  nav.replaceChildren.apply(nav,kids);
}
function renderSheet(){
  var st=STEPS[stepIndex(cur)],i=stepIndex(cur),sheet=document.getElementById('sheet');
  var kids=[h('header',{class:'sheet-head'},h('div',{class:'eyebrow',text:st.id==='card'?'Summary':'Checkpoint '+(i+1)+' / 6'}),h('h2',{text:st.t}),h('p',{class:'rule',text:st.rule}),st.why?h('p',{class:'why',text:st.why}):null)];
  var body=VIEWS[cur]();
  if(cur==='card')kids=kids.concat(body);
  else{kids=kids.concat(body);kids.push(h('section',{class:'readout',id:'readout','aria-live':'polite'},readoutFn()))}
  kids.push(h('div',{class:'navrow'},
    i>0?h('button',{class:'btn',type:'button',text:'← '+STEPS[i-1].t,onclick:function(){go(STEPS[i-1].id,true)}}):h('span'),
    i<STEPS.length-1?h('button',{class:'btn pri',type:'button',text:STEPS[i+1].t+' →',onclick:function(){go(STEPS[i+1].id,true)}}):h('span')));
  sheet.replaceChildren.apply(sheet,kids);
}
var confirmReset=false;
function renderMode(){
  var bar=document.getElementById('modebar'),kids=[];
  if(store.mode==='own'){
    kids.push(h('p',null,h('span',{class:'tag',text:'내 안내서'}),'여기 적는 내용은 당신에게만 보입니다.'));
    var acts=h('div',{class:'acts'},h('span',{class:'status',id:'status',role:'status',text:statusText||'이 기기에 저장됨'}),h('button',{class:'btn sm',type:'button',text:'예시 보기',onclick:function(){store.mode='example';ex=example();confirmReset=false;saveLocal();if(sync){syncDirty=true;push()}renderAll()}}));
    if(confirmReset)acts.appendChild(h('button',{class:'btn sm',type:'button',style:'border-color:var(--crit);color:var(--crit)',text:'정말 전부 지우기',onclick:function(){store.own=blank();confirmReset=false;save();renderAll()}}));
    else acts.appendChild(h('button',{class:'btn sm ghost',type:'button',text:'처음부터',onclick:function(){confirmReset=true;renderMode()}}));
    kids.push(acts);
  }else{
    kids.push(h('p',null,h('span',{class:'tag',text:'예시'}),'38세 재향군인 간호사의 실제 과정을 단순화한 숫자입니다. 눌러 보고 고쳐 봐도 저장되지 않습니다.'));
    kids.push(h('div',{class:'acts'},h('button',{class:'btn pri',type:'button',text:store.own?'내 안내서로 돌아가기':'내 것으로 시작하기',onclick:function(){if(!store.own)store.own=blank();store.mode='own';save();go('line')}})));
  }
  bar.replaceChildren.apply(bar,kids);
}
function renderAll(){renderMode();renderRoute();renderSheet()}
function go(id,scroll){
  cur=VIEWS[id]?id:'line';
  try{if(location.hash!=='#'+cur)history.replaceState(null,'','#'+cur)}catch(e){try{location.hash=cur}catch(e2){}}
  renderAll();
  if(scroll){var el=document.getElementById('route');if(el&&el.scrollIntoView)el.scrollIntoView({block:'start'})}
}
window.addEventListener('hashchange',function(){var id=location.hash.slice(1);if(VIEWS[id]&&id!==cur){cur=id;renderAll()}});

var start=location.hash.slice(1);if(VIEWS[start])cur=start;
renderAll();
initSync();
})();
</script>
