<title>The Drifter's Guide to Gravity</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: a field guide read in deep space, one night-sky look in every theme. Cover band, a route of six checkpoints (rail on desktop, strip on phone), one working sheet at a time, each ending in a readout. */
:root{
  color-scheme:dark;
  --bg:#070A17;--surface:#111731;--sunk:#050713;
  --ink:#E8EAF4;--ink2:#A9B0CC;--ink3:#7C85A8;
  --rule:#262E52;
  --accent:#86BEDD;--accent-ink:#06101A;--accent-bg:#14294A;
  --contour:#F5D9A0;
  --good:#6FD39A;--warn:#E5B95C;--crit:#F0857C;
  --stars:radial-gradient(1.2px 1.2px at 24px 38px,rgba(232,234,244,.75) 50%,transparent 52%),radial-gradient(1px 1px at 132px 96px,rgba(232,234,244,.5) 50%,transparent 52%),radial-gradient(1.4px 1.4px at 196px 20px,rgba(245,217,160,.7) 50%,transparent 52%),radial-gradient(1px 1px at 78px 172px,rgba(232,234,244,.45) 50%,transparent 52%),radial-gradient(1px 1px at 228px 148px,rgba(134,190,221,.6) 50%,transparent 52%),radial-gradient(.8px .8px at 160px 210px,rgba(232,234,244,.4) 50%,transparent 52%);
  --sans:'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Consolas,monospace;
  --serif:'Gowun Batang','Noto Serif KR',Georgia,serif;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--stars),radial-gradient(100% 60% at 50% 0%,#17203F 0%,transparent 70%),var(--bg);background-size:260px 240px,260px 240px,260px 240px,260px 240px,260px 240px,260px 240px,100% 900px,auto;background-repeat:repeat,repeat,repeat,repeat,repeat,repeat,no-repeat,repeat;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* cover */
.cover{border-bottom:1px solid var(--rule)}
.cover .wrap{padding-block:28px 22px;display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between}
.cover-id{min-width:0;flex:1 1 320px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.cover h1{font-family:var(--serif);font-weight:700;font-size:clamp(24px,4.6vw,38px);line-height:1.15;letter-spacing:-.01em;text-wrap:balance;margin-top:8px}
.cover .ko{color:var(--ink2);margin-top:6px}
.motto{font-family:var(--mono);font-weight:600;font-size:clamp(15px,2.6vw,20px);letter-spacing:.06em;color:var(--contour);border:2px solid var(--contour);padding:8px 14px;border-radius:2px;white-space:nowrap;transform:rotate(-2deg)}

/* mode bar */
.modebar{border-bottom:1px solid var(--rule);background:rgba(17,23,49,.7)}
.modebar .wrap{padding-block:10px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.modebar p{font-size:13px;color:var(--ink2);min-width:0;flex:1 1 260px}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--contour);color:var(--contour);border-radius:2px;margin-right:8px}
.modebar .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.status{font-family:var(--mono);font-size:11px;color:var(--ink3)}

/* buttons */
.btn{border:1px solid var(--rule);background:var(--surface);padding:7px 13px;border-radius:3px;cursor:pointer;font-size:13.5px;font-weight:500}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-style:dashed;color:var(--ink2)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.x{border:none;background:none;color:var(--ink3);cursor:pointer;padding:4px 8px;font-size:16px;line-height:1;border-radius:3px}
.x:hover{color:var(--crit)}

/* shell */
.shell{display:grid;grid-template-columns:1fr;gap:20px;padding-block:20px 56px}
@media (min-width:860px){.shell{grid-template-columns:212px minmax(0,1fr);gap:40px;padding-block:32px 72px}}

/* route */
.route{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.cp{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--surface);border-radius:3px;padding:6px 10px;cursor:pointer;text-align:left}
.cp .n{font-family:var(--mono);font-size:11px;width:20px;height:20px;border:1.5px solid var(--ink3);border-radius:50%;display:grid;place-items:center;color:var(--ink3);flex:none}
.cp .t{font-size:13.5px;font-weight:600;white-space:nowrap}
.cp .d{display:none}
.cp.done .n{border-color:var(--good);background:var(--good);color:var(--surface)}
.cp[aria-current="true"]{border-color:var(--accent);background:var(--accent-bg)}
.cp[aria-current="true"] .n{border-color:var(--accent);color:var(--accent)}
.cp.done[aria-current="true"] .n{color:var(--surface);border-color:var(--good)}
@media (min-width:860px){
  .route{flex-direction:column;gap:0;overflow:visible;position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);align-self:start;padding:0}
  .cp{border:none;background:none;padding:9px 8px;align-items:flex-start;position:relative;border-radius:3px}
  .cp:not(:last-child)::after{content:"";position:absolute;left:17.5px;top:32px;bottom:-8px;border-left:1.5px dashed var(--contour);opacity:.6}
  .cp .n{margin-top:2px;background:var(--bg);position:relative;z-index:1}
  .cp .d{display:block;font-size:12px;color:var(--ink3);line-height:1.4;font-weight:400}
  .cp[aria-current="true"]{background:var(--accent-bg)}
  .cp[aria-current="true"] .n{background:var(--accent-bg)}
  .cp.done .n{background:var(--good)}
}

/* sheet */
.sheet{min-width:0;display:flex;flex-direction:column;gap:26px}
.sheet-head h2{font-family:var(--serif);font-size:clamp(26px,5vw,34px);font-weight:700;line-height:1.2;margin-top:4px}
.sheet-head .rule{font-size:16px;color:var(--ink);margin-top:8px;max-width:38em;text-wrap:pretty}
.sheet-head .why{font-size:13.5px;color:var(--ink2);margin-top:6px;max-width:44em}
.q{display:flex;flex-direction:column;gap:10px}
.q>h3{font-size:14.5px;font-weight:600}
.q>h3 .k{font-family:var(--mono);font-size:11px;color:var(--contour);letter-spacing:.08em;margin-right:8px}
.q>.hint{font-size:13px;color:var(--ink3);margin-top:-6px;max-width:46em}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:8px 10px}
.row>.grow{flex:1 1 180px;min-width:0}
input[type=text],input[type=number],input[type=date],textarea{width:100%;background:var(--bg);border:1px solid var(--rule);border-radius:3px;padding:7px 9px;min-width:0}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
textarea{resize:vertical;min-height:64px;line-height:1.55}
input::placeholder,textarea::placeholder{color:var(--ink3)}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field>span{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.w-s{flex:0 0 84px}.w-m{flex:0 0 120px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:2px 10px;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:5px 11px;cursor:pointer;font-size:12.5px;border-left:1px solid var(--rule)}
.seg button:first-child{border-left:none}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* readout */
.readout{border:1px solid var(--ink3);background:var(--surface);border-radius:2px;padding:18px 18px 20px;display:flex;flex-direction:column;gap:14px}
.readout>.eyebrow{color:var(--contour)}
.big{font-family:var(--serif);font-size:clamp(20px,3.6vw,26px);line-height:1.35;font-weight:700;text-wrap:balance}
.big .num{font-family:var(--mono);font-weight:600;color:var(--accent)}
.note{font-size:13px;color:var(--ink2);max-width:46em}
.note.warn{color:var(--warn)}.note.crit{color:var(--crit)}.note.good{color:var(--good)}
.tally{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:13.5px}
.bar{height:10px;background:var(--sunk);border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:0 2px 2px 0}
.bar>i.mute{background:var(--ink3)}
.bar>i.over{background:var(--crit)}
.stack{display:flex;gap:2px;height:22px}
.stack>i{display:block;background:var(--ink3);opacity:.55;min-width:2px;border-radius:1px}
.stack>i.free{background:var(--accent);opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--ink2)}
.legend b{font-family:var(--mono);font-weight:500;color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:500;padding:6px 8px;border-bottom:1.5px solid var(--rule)}
td{padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
.cols{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:720px){.cols.c3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.col>h3{font-size:14px;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:baseline;border-bottom:1.5px solid var(--ink);padding-bottom:5px}
.col>h3 small{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--ink3)}
.col>.cap{font-size:12.5px;color:var(--ink3)}
.track{background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:10px;display:flex;flex-direction:column;gap:8px}
.track .top{display:flex;gap:6px;align-items:center}
.track .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.empty{border:1px dashed var(--rule);border-radius:3px;padding:14px;font-size:13px;color:var(--ink3);text-align:center}
.creed{font-family:var(--serif);font-size:clamp(18px,3.2vw,23px);line-height:1.7}
.creed span{display:block}
.creed .ph{color:var(--ink3)}
.check{width:20px;height:20px;accent-color:var(--good);cursor:pointer}
.navrow{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--rule);padding-top:16px}
.card-grid{display:grid;grid-template-columns:1fr;gap:0}
.card-grid>div{padding:12px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:1fr;gap:2px}
@media (min-width:620px){.card-grid>div{grid-template-columns:110px minmax(0,1fr);gap:16px}}
.card-grid>div:last-child{border-bottom:none}
.card-grid dt{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--contour);padding-top:3px}
.card-grid dd{margin:0;min-width:0;overflow-wrap:anywhere}
.fine{font-size:12px;color:var(--ink3);max-width:60em}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .25s ease}}

/* app chrome */
html,body{height:100%}
.cover.compact .wrap{padding-block:12px}
.cover.compact h1{font-size:19px;margin-top:0}
.cover.compact .eyebrow,.cover.compact .ko,.cover.compact .motto{display:none}
.navrow{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 35%);padding-bottom:12px;z-index:5}

/* home: one fixed night-sky panel, same in both themes */
:root{--space:#090D1C;--space2:#17203F;--space-ink:#E8EAF4;--space-dim:#8A93B8;--star:#F5D9A0;--planet:#86BEDD}
.space{border:1px solid var(--rule);background:radial-gradient(120% 90% at 50% 45%,var(--space2) 0%,var(--space) 70%);color:var(--space-ink);border-radius:6px;padding:18px 16px 20px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.space .eyebrow{color:var(--space-dim)}
.skybtn{border:none;background:none;padding:0;cursor:pointer;display:block;width:100%;max-width:560px;margin:0 auto;border-radius:4px}
.skybtn:focus-visible{outline-color:var(--star)}
.sky{display:block;width:100%;height:auto}
.sky text{font-family:var(--sans);font-size:12px;fill:var(--space-ink);text-anchor:middle}
.sky text.dim{fill:var(--space-dim);font-size:11px}
.sky text.core{font-weight:600;font-size:13px}
.space-h{font-family:var(--serif);font-weight:700;font-size:clamp(21px,4.4vw,28px);line-height:1.3;text-wrap:balance}
.space-sub{font-family:var(--mono);font-size:12px;color:var(--space-dim)}
.nextcard{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border:1px solid var(--ink3);background:var(--surface);border-radius:2px;padding:14px 16px}
.nextcard p{min-width:0;flex:1 1 200px}
.nextcard .btn{padding:10px 16px;font-weight:600}
.cplist{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.cprow{display:grid;grid-template-columns:24px 52px minmax(0,1fr);gap:10px;align-items:center;border:none;border-bottom:1px solid var(--rule);background:none;padding:11px 2px;text-align:left;cursor:pointer}
.cprow:hover{background:var(--surface)}
.cprow .n{font-family:var(--mono);font-size:11px;width:20px;height:20px;border:1.5px solid var(--ink3);border-radius:50%;display:grid;place-items:center;color:var(--ink3)}
.cprow.done .n{border-color:var(--good);background:var(--good);color:var(--surface)}
.cprow b{font-weight:600}
.cprow .v{color:var(--ink2);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* onboarding */
.onb[hidden]{display:none}
.onb{min-height:100%;display:flex;flex-direction:column}
.onb-in{flex:1;display:flex;flex-direction:column;gap:24px;width:100%;max-width:560px;margin:0 auto;padding-block:20px 24px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.onb-top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:32px}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:3px;background:var(--rule);border-radius:2px}
.dots i.on{background:var(--contour)}
.onb-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;min-width:0}
.onb-body h1{font-family:var(--serif);font-weight:700;font-size:clamp(34px,9vw,52px);line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
.onb-body h2{font-family:var(--serif);font-weight:700;font-size:clamp(26px,6.4vw,36px);line-height:1.25;text-wrap:balance}
.onb-body p{font-size:16px;color:var(--ink2);max-width:32em;text-wrap:pretty}
.onb-body .motto{align-self:flex-start;margin-top:8px}
.onb-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.onb-list li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.onb-list li:last-child{border-bottom:none}
.onb-list .n{font-family:var(--mono);font-size:12px;color:var(--contour)}
.onb-list b{font-weight:600}
.onb-list span.d{color:var(--ink2);font-size:14px;margin-left:8px}
.pick{display:flex;flex-direction:column;gap:8px}
.pick button{text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:3px;padding:12px 14px;cursor:pointer;font-size:15px}
.pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-bg);font-weight:600}
.onb-foot{display:flex;flex-direction:column;gap:8px}
.onb-foot .btn{padding:13px 16px;font-size:15.5px;font-weight:600;text-align:center}
.onb-foot .btn.plain{border-color:transparent;background:transparent;color:var(--ink2);font-weight:500}

/* one question per screen */
.pagerrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pager{display:flex;gap:6px;flex-wrap:wrap}
.pager button{width:26px;height:14px;padding:0;border:none;background:none;cursor:pointer;position:relative}
.pager button::after{content:"";position:absolute;left:0;right:0;top:5px;height:4px;border-radius:2px;background:var(--rule)}
.pager button.past::after{background:var(--ink3)}
.pager button.on::after{background:var(--contour)}
.qpage>h3{font-family:var(--serif);font-size:clamp(22px,4.6vw,28px);line-height:1.3;font-weight:700;text-wrap:balance}
.qpage>h3 .k{display:block;margin-bottom:6px}
.qpage>.hint{font-size:14.5px;color:var(--ink2);margin-top:-2px}
.qpage{gap:14px;min-height:38vh}
.track .top input{flex:1}

/* controls as celestial bodies: primary = ringed planet, secondary = dark moon, selected = lit */
:root{
  --orb-pri:radial-gradient(120% 150% at 28% 15%,#D3ECF8 0%,#86BEDD 40%,#3B7AA2 100%);
  --orb-moon:radial-gradient(120% 150% at 28% 15%,#2D3868 0%,#171E40 55%,#0B1027 100%);
  --orb-star:radial-gradient(circle at 35% 30%,#FFF4DA 0%,#F5D9A0 55%,#C4913C 100%);
  --orb-good:radial-gradient(circle at 35% 30%,#CBF5DC 0%,#6FD39A 55%,#2C8A59 100%);
  --moon-edge:rgba(134,190,221,.24);
}
.btn{border-radius:999px;border:1px solid var(--moon-edge);background:var(--orb-moon);padding:9px 18px;box-shadow:inset -6px -8px 14px rgba(0,0,0,.45),inset 3px 4px 8px rgba(255,255,255,.06)}
.btn:hover{border-color:var(--accent);box-shadow:inset -6px -8px 14px rgba(0,0,0,.45),inset 3px 4px 8px rgba(255,255,255,.06),0 0 14px rgba(134,190,221,.35)}
.btn.sm{padding:4px 12px}
.btn.pri{position:relative;isolation:isolate;background:var(--orb-pri);border-color:transparent;color:var(--accent-ink);box-shadow:inset -8px -10px 16px rgba(10,40,70,.45),inset 4px 5px 10px rgba(255,255,255,.35),0 0 18px rgba(134,190,221,.45)}
.btn.pri::before{content:"";position:absolute;inset:-4px -12px;border:1.5px solid rgba(245,217,160,.75);border-radius:50%;transform:rotate(-5deg);z-index:-1;pointer-events:none}
.btn.pri:hover{box-shadow:inset -8px -10px 16px rgba(10,40,70,.45),inset 4px 5px 10px rgba(255,255,255,.35),0 0 26px rgba(134,190,221,.7)}
.btn.ghost{background:transparent;border:1px dashed var(--ink3);box-shadow:none}
.onb-foot .btn.plain{box-shadow:none}
.chip{background:var(--orb-moon);border-color:var(--moon-edge);box-shadow:inset -3px -4px 6px rgba(0,0,0,.4);padding:3px 12px}
.chip[aria-pressed="true"]{background:var(--orb-pri);border-color:transparent;color:var(--accent-ink);box-shadow:inset -3px -4px 6px rgba(10,40,70,.4),0 0 10px rgba(134,190,221,.55)}
.seg{border:none;overflow:visible;border-radius:0;gap:6px;flex-wrap:wrap}
.seg button,.seg button:first-child{border:1px solid var(--moon-edge);border-radius:999px;background:var(--orb-moon);box-shadow:inset -3px -4px 6px rgba(0,0,0,.4);min-width:34px;height:34px;padding:0 12px}
.seg button[aria-pressed="true"]{background:var(--orb-pri);color:var(--accent-ink);border-color:transparent;box-shadow:inset -3px -4px 6px rgba(10,40,70,.4),0 0 10px rgba(134,190,221,.55)}
.cp{border-radius:999px}
.cp .n,.cprow .n{border:none;width:22px;height:22px;background:var(--orb-moon);color:var(--ink2);box-shadow:inset -3px -3px 5px rgba(0,0,0,.5),0 0 0 1px var(--moon-edge)}
.cp.done .n,.cprow.done .n{background:var(--orb-good);color:#06210F;box-shadow:inset -3px -3px 5px rgba(0,60,30,.35)}
.cp[aria-current="true"] .n,.cp.done[aria-current="true"] .n{background:var(--orb-star);color:#3A2A08;box-shadow:0 0 12px rgba(245,217,160,.75)}

<script>
(function(){

/* ---------- helpers ---------- */

function uid(){return Math.random().toString(36).slice(2,9)}

/* ---------- model ---------- */
var VERBS=['care','build','protect','teach','fix','understand','connect','express','organize','lead','explore','sell'];
var RES=[['money','Money'],['time','Time'],['energy','Energy'],['focus','Focus']];
var HOURS=[['sleep','Sleep'],['work','Work'],['care','Care & chores'],['commute','Travel'],['basics','Meals & hygiene']];
var TIERS=[['gravity','Gravity'],['orbit','Orbit'],['standby','Standby']];

function blank(){return{
  v:2,currency:'$',
  line:{items:[],sentence:''},
  limit:{levels:{money:3,time:3,energy:3,focus:3},hours:{sleep:49,work:40,care:14,commute:5,basics:14},pick:''},
  assets:{rate:3,streams:[],financial:0,unused:[]},
  order:{tracks:[]},
  creed:{forWhom:'',can:'',gap:'',lineage:'',lines:['','','']},

}}
function example(){return{
  v:2,currency:'$',

  ],sentence:'I am someone who builds and someone who cares.'},
  limit:{levels:{money:4,time:1,energy:2,focus:2},hours:{sleep:49,work:40,care:35,commute:7,basics:14},pick:'time'},
  assets:{rate:3,streams:[
    {id:'s1',name:'VA disability compensation',amount:49898,years:42,sure:true},

    {id:'t1',name:'LVN → BSN → PMHNP',tier:'gravity',hours:12,chain:true,window:true,relight:''},
    {id:'t2',name:'Veteran benefits education',tier:'orbit',hours:4,chain:true,window:false,relight:''},
    {id:'t3',name:'AI music catalog',tier:'orbit',hours:3,chain:false,window:false,relight:''},
    {id:'t4',name:'Booking app, menu app',tier:'standby',hours:0,chain:false,window:false,relight:'When BSN admission is confirmed'},
    {id:'t5',name:'Café',tier:'standby',hours:0,chain:false,window:false,relight:'After the PMHNP license'},
    {id:'t6',name:'General AI business',tier:'standby',hours:0,chain:false,window:false,relight:'Revisit when the gravity line is done'}

    lineage:'Georges Hébert: "Être fort pour être utile." Then MovNat, Mark Twight, Peter Attia.',
    lines:['Be strong to be useful.','Prove I can return.','Then stay where I returned.']
  },
  proof:{name:"A test named after his daughter",events:[
    {id:'e1',name:'Sprint',standard:'400 m',meaning:'Running to her'},
    {id:'e2',name:'Farmer carry',standard:'Her weight plus more, 100 m',meaning:'Carrying her out'},
    {id:'e3',name:'Rise from the floor',standard:'Without hands',meaning:'Getting up on my own'},
    {id:'e4',name:'Ruck',standard:'2 miles',meaning:'The feel of a casualty carry'}
  ],log:[
    {id:'l1',date:'2026-10-04',res:{e1:true,e3:true}},
    {id:'l2',date:'2026-11-01',res:{e1:true,e2:true,e3:true}}
  ],action:{text:'Call to check the tuition program application status',due:'',done:false}}
}}

var LS='drifters-guide:v2';
var store={mode:'example',own:null,updatedAt:0,onboarded:false,profile:{name:'',state:''}};
try{var raw=localStorage.getItem(LS);if(raw){var p=JSON.parse(raw);if(p&&typeof p==='object'){store.mode=p.mode==='own'&&p.own?'own':'example';store.own=p.own||null;store.updatedAt=p.updatedAt||0;store.onboarded=!!p.onboarded;if(p.profile)store.profile={name:String(p.profile.name||''),state:String(p.profile.state||'')}}}}catch(e){}
var ex=example();
function S(){return store.mode==='own'&&store.own?store.own:ex}

/* ---------- persistence ---------- */
var sync=null,syncTimer=null,syncing=false,syncDirty=false,statusText='';

function save(){
  if(store.mode!=='own')return;
  store.updatedAt=Date.now();
  var ok=saveLocal();
  if(sync){syncDirty=true;clearTimeout(syncTimer);syncTimer=setTimeout(push,1500)}

  if(!sync||syncing||!syncDirty)return;

    syncing=false;setStatus('Saved to your account');if(syncDirty)push();
  },function(){
    syncing=false;sync=null;setStatus('Saved on this device');

function initSync(){
  if(!window.claude||typeof window.claude.use!=='function')return;

    var db=r[0],user=r[1];if(!db||!user)return;
    return user.id().then(function(id){
      if(!id)return;
      var ref=db.doc('data/users/'+id+'/guide-en');
      return ref.get().then(function(snap){
        sync=ref;
        var d=snap.exists?snap.data():null;

/* ---------- money ---------- */
function money(v){
  var c=S().currency,a=Math.abs(v),s=(v<0?'-':'')+c;
  if(a>=1e9)return s+(a/1e9).toFixed(2)+'B';
  if(a>=1e6)return s+(a/1e6).toFixed(2)+'M';
  return s+Math.round(a).toLocaleString('en-US');
}
function pv(amount,years,rate){
  var r=rate/100;if(years<=0||amount<=0)return 0;
  if(r<=0)return amount*years;
  return amount*(1-Math.pow(1+r,-years))/r;
}

/* ---------- derived ---------- */
function verbTally(){
  var m={};S().line.items.forEach(function(it){(it.verbs||[]).forEach(function(v){m[v]=(m[v]||0)+1})});

}
function third(v){return /(x|ch|sh|s)$/.test(v)?v+'es':v+'s'}

function resName(k){for(var i=0;i<RES.length;i++)if(RES[i][0]===k)return RES[i][1];return''}
function assetSum(){
  var a=S().assets,sure=0,vari=0;
  a.streams.forEach(function(s){var x=pv(num(s.amount),num(s.years),num(a.rate));if(s.sure)sure+=x;else vari+=x});
  return{sure:sure,vari:vari,fin:num(a.financial)};
}
function allocated(){var t=0;S().order.tracks.forEach(function(x){if(x.tier!=='standby')t+=num(x.hours)});return t}
function tierCount(k){return S().order.tracks.filter(function(x){return x.tier===k}).length}
function fullPass(a){var ev=S().proof.events;return ev.length>0&&ev.every(function(e){return a.res&&a.res[e.id]})}
function sortedLog(){return S().proof.log.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0})}
function stayCount(){var l=sortedLog(),n=0;for(var i=l.length-1;i>=0;i--){if(fullPass(l[i]))n++;else break}return n}
function done(step){
  var s=S();
  switch(step){
    case'line':return s.line.items.filter(function(i){return i.what&&i.verbs&&i.verbs.length}).length>=3&&!!s.line.sentence.trim();
    case'limit':return!!s.limit.pick;
    case'assets':return s.assets.streams.some(function(x){return num(x.amount)>0&&num(x.years)>0})||num(s.assets.financial)>0;
    case'order':return tierCount('gravity')===1&&tierCount('orbit')<=2;
    case'creed':return s.creed.lines.every(function(l){return l.trim()});
    case'proof':return s.proof.events.filter(function(e){return e.name&&e.standard}).length>=3&&!!s.proof.action.text.trim();
  }
  return false;
}

/* ---------- steps ---------- */
var STEPS=[
  {id:'line',t:'Line',d:'One line through scattered things',rule:'Things that look scattered are different outputs of the same motive.',why:'List what you have done and tag each with a verb. The verbs that keep coming back are your line.'},
  {id:'limit',t:'Constraint',d:'Find the real bottleneck',rule:'Price every plan in your scarcest resource.',why:'Most people blame money. Time or energy usually runs out first. See which one, in numbers.'},
