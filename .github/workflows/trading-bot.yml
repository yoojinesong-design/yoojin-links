# Runs one trading check ("tick") on a schedule, so the bot trades on its own
# without a server. It does NOTHING until you set the repository variable
# TRADING_BOT_ENABLED=true (Settings > Secrets and variables > Actions > Variables).
# Setup: trading-bot/README.md, section "GitHub Actions".
#
# Before you trade real money from here, know that:
# - in a PUBLIC repository anyone can read every run's log and download its
#   logs artifact: your equity, positions and every order. Use a private repo.
# - GitHub switches schedules off in a public repository after 60 days without
#   a commit. The bot then stops checking stop-losses, and cannot tell you.
# - the bot's memory (what it bought) lives in the Actions cache, which GitHub
#   deletes after 7 days without a run. A run that finds no saved state fails
#   (see "Restore bot state") instead of forgetting what the bot bought. A run
#   whose state could not be saved fails too ("Check the bot state was saved"),
#   and the next run then gets an older state back: the bot sees in the
#   broker's order history that it is out of date and places no orders at all
#   (Alpaca) until you start over with fresh_state (README section 4).
# - it runs only on the default branch: a run on another branch would keep its
#   state in a cache that the scheduled runs never see.
name: trading-bot

on:
  schedule:
    # Every 15 minutes, Mon-Fri, 13:00-20:59 UTC. That covers the US stock
    # market (9:30-16:00 New York) in both summer and winter time; the bot
    # itself skips ticks while the market is closed. GitHub may start
    # scheduled runs a few minutes late.
    - cron: "*/15 13-20 * * 1-5"
  workflow_dispatch:
    inputs:
      fresh_state:
        description: "Start from a blank bot state, dropping any saved one (the first run, or after it was lost or out of date)"
        type: boolean
        default: false

permissions:
  contents: read

# Never let two ticks overlap.
concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  tick:
    if: >-
      vars.TRADING_BOT_ENABLED == 'true' &&
      (github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: trading-bot
    env:
      CONFIG: ${{ vars.TRADING_BOT_CONFIG || 'configs/stocks.yaml' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trading-bot/requirements.txt

      - run: pip install -r requirements.txt

      # The bot keeps a little state between ticks (what it bought, today's
      # trade count, the last bar it acted on, the daily-loss baseline). Each
      # run is a fresh machine, so carry it over in the Actions cache. No saved
      # state (never saved, or deleted by GitHub after 7 days unused) FAILS the
      # run: a blank state would forget what the bot bought, and those
      # positions would lose their stop-loss for good. Run it by hand with
      # "fresh_state" ticked (which skips this step) only for the very first
      # run, or to start over (README section 4).
      - name: Restore bot state
        id: restore
        if: ${{ !inputs.fresh_state }}
        uses: actions/cache/restore@v4
        with:
          path: trading-bot/state
          key: trading-bot-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: trading-bot-state-
          fail-on-cache-miss: true

      - name: Run one trading tick
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          CCXT_API_KEY: ${{ secrets.CCXT_API_KEY }}
          CCXT_SECRET: ${{ secrets.CCXT_SECRET }}
          CCXT_PASSWORD: ${{ secrets.CCXT_PASSWORD }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Only matters if your config says `mode: live`. Leave this secret
          # unset to make real-money trading impossible.
          LIVE_TRADING_CONFIRM: ${{ secrets.LIVE_TRADING_CONFIRM }}
        run: python -m bot -c "$CONFIG" once

      - name: Save bot state
        # Never after a failed restore: a blank state would become the newest cache.
        if: always() && (steps.restore.outputs.cache-matched-key != '' || inputs.fresh_state)
        uses: actions/cache/save@v4
        with:
          path: trading-bot/state
          key: trading-bot-state-${{ github.run_id }}-${{ github.run_attempt }}

      # actions/cache/save only WARNS when the upload fails, and the next run
      # would then restore an older state without a word. Fail loudly instead.
      - name: Check the bot state was saved
        if: always() && (steps.restore.outputs.cache-matched-key != '' || inputs.fresh_state)
        uses: actions/cache/restore@v4
        with:
          path: trading-bot/state
          key: trading-bot-state-${{ github.run_id }}-${{ github.run_attempt }}
          lookup-only: true
          fail-on-cache-miss: true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-bot-logs-${{ github.run_id }}
          path: trading-bot/logs
          retention-days: 14
          if-no-files-found: ignore
