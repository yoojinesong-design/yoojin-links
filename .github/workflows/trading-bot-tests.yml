name: trading-bot tests

on:
  push:
    paths:
      - "trading-bot/**"
      - ".github/workflows/trading-bot-tests.yml"
  pull_request:
    paths:
      - "trading-bot/**"
      - ".github/workflows/trading-bot-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: trading-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: trading-bot/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
